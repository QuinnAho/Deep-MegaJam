; Texture size limits for the Windows build (and the editor, which inherits from the Windows profile).
;
; Why: the jam's limit is 1 GB zipped. The Dragon Cave pack ships 4K and 8K textures, and the 42 meshes the game
; places pulled about 890 MB of them into the build (zip 1,318 MB at 71eaaa8). The pack is read-only, so the limit
; is set here and not on its assets.
;
; How: when cooking, the engine leaves out every mip larger than the group's MaxLODSize
; (TextureDerivedData.cpp, FirstMipToSerialize = CookingTarget()->GetTextureLODSettings().CalculateLODBias(...)).
; A profile only has to list the groups it changes; the rest come from its parent
; (UDeviceProfile::ValidateTextureLODGroups). The other values on each line are the engine's own defaults
; (Engine/Config/BaseDeviceProfiles.ini, [GlobalDefaults DeviceProfile]).
;
; Virtual textures ignore MaxLODSize (TextureLODSettings.cpp, CalculateLODBias), and most of the pack's textures are
; virtual: with MaxLODSize alone the zip only fell from 1,318 to 1,160 MB. They cannot take a flat size limit either,
; because the big ones are grids of 4096 tiles (the dragon is 20480x8192, the stonework 28672x4096): MaxLODSize_VT=2048
; brought the zip to 530 MB by shrinking each tile to 256 pixels. LODBias_VT=1 drops one mip from every virtual
; texture instead, so each tile becomes 2048 whatever the grid.
;
; So: plain textures are limited to 2048, and virtual textures lose their top mip.
; If the zip gets close to the limit again, LODBias_VT=2 (tiles of 1024) is the next step.

[Windows DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,LODBias_VT=1,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,LODBias_VT=1,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,LODBias_VT=1,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=2048,LODBias=0,LODBias_VT=1,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,LODBias_VT=1,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,LODBias_VT=1,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
